[build]
  publish = "dashboard"
  functions = "netlify/functions"
  # Check only the commit SUBJECT line (%s), not the full body (%B) — a commit
  # explaining "the [skip ci] mechanism" in its body would otherwise match this
  # substring check and get silently skipped, even though it has real changes.
  ignore = "git log -1 --pretty=%s | grep -q '\\[skip ci\\]'"

[build.environment]
  NODE_VERSION = "20"

[dev]
  port = 3001
  functionsPort = 3002

[[redirects]]
  from = "/status/:project"
  to = "/?view=:project"
  status = 200

[[redirects]]
  from = "/group/:name"
  to = "/?group=:name"
  status = 200

[[redirects]]
  from = "/report/*"
  to = "/.netlify/functions/view-report/:splat"
  status = 200
