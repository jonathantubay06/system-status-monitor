name: Health Monitor

on:
  schedule:
    # Runs every 15 min on paper, but GitHub free-tier throttles
    # scheduled workflows — actual interval is typically 30-60 min.
    # The dashboard calculates the real interval from history data.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Run health checks
        env:
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          # Slack alerts are allowed (free, no credit limits)
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # NOTE: Email API keys deliberately NOT passed to the workflow.
          # Emails are sent ONLY via the dashboard's manual "Send Report" button,
          # which runs as a Netlify function (uses its own RESEND_API_KEY env var).
          # Defense-in-depth: even if code accidentally calls a send function,
          # there's no API key available to authenticate the request.
        run: node scripts/monitor.js
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage dashboard files (skip missing ones silently)
          for f in status.json history.json client-reports.json incident-notes.json alert-log.json; do
            [ -f "dashboard/$f" ] && git add "dashboard/$f" || true
          done
          # Stage failure screenshots (one small JPEG per project, overwritten each run)
          [ -d "dashboard/screenshots" ] && git add dashboard/screenshots/ || true
          git diff --staged --quiet || git commit -m "chore: health check [$(date -u '+%Y-%m-%d %H:%M UTC')] [skip ci]"
          # Discard any non-dashboard unstaged changes (e.g. package-lock from npm install)
          # so the rebase has a clean working tree.
          git checkout -- . 2>/dev/null || true
          # Retry loop: if rebase conflicts on auto-generated dashboard
          # files, abort and retry with our version (latest check wins).
          for i in 1 2 3; do
            git pull --rebase origin main && break
            echo "Rebase conflict (attempt $i) — resolving with latest check data"
            git rebase --abort 2>/dev/null || true
            # Force-checkout our version of dashboard files and re-commit
            git checkout HEAD -- dashboard/
            git add dashboard/
            git diff --staged --quiet || git commit -m "chore: health check [$(date -u '+%Y-%m-%d %H:%M UTC')] [skip ci]"
          done
          git push
