name: Health Monitor

on:
  schedule:
    # Runs every 15 min on paper, but GitHub free-tier throttles
    # scheduled workflows — actual interval is typically 30-60 min.
    # The dashboard calculates the real interval from history data.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Run health checks
        env:
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: node scripts/monitor.js
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/status.json dashboard/history.json dashboard/client-reports.json dashboard/incident-notes.json dashboard/alert-log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: health check [$(date -u '+%Y-%m-%d %H:%M UTC')] [skip ci]"
          # Retry loop: if rebase conflicts on auto-generated dashboard
          # files, abort and retry with our version (latest check wins).
          for i in 1 2 3; do
            git pull --rebase origin main && break
            echo "Rebase conflict (attempt $i) — resolving with latest check data"
            git rebase --abort
            # Force-checkout our version of dashboard files and re-commit
            git checkout HEAD -- dashboard/
            git add dashboard/
            git diff --staged --quiet || git commit -m "chore: health check [$(date -u '+%Y-%m-%d %H:%M UTC')] [skip ci]"
          done
          git push
